# ============================================================
# herdrateUi — GitHub Actions
# Traducido desde .gitlab-ci.yml (ver odd/tasks/github-migration-translation.md)
#
# DESVIACIÓN DOCUMENTADA (sección 0 de la guía): en GitLab este pipeline
# es 100% tag-only (`.tag_only` en TODOS los jobs) y el job `deploy_docs`
# consume los artifacts del job `build` dentro del MISMO pipeline. En
# GitHub los artifacts no cruzan entre workflows, así que los 5 jobs viven
# en un único workflow para preservar ese flujo de artifacts.
#
# Mapeo de jobs (nombres idénticos a propósito: son los required checks):
#   lint -> lint | test -> test | build -> build
#   deploy_docs -> deploy_docs | rollback -> rollback
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to roll back to (empty = previous tag computed automatically)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Lint stage
  # ============================================================

  # Gate de tag semver: las expresiones de GitHub Actions no tienen regex
  # (no existe `matches()`), asi que el filtro exacto de las tag rules de
  # GitLab (^vX.Y.Z con prerelease opcional) se evalua aqui en bash.
  # Salida `release`: 'true' solo para tags semver validas.
  release_gate:
    name: release_gate
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dryrun)\.[0-9]+)?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El script `check` de GitLab era `biome check packages/ docs/ biome.json .gitlab-ci.yml`.
      # Como esta migración elimina `.gitlab-ci.yml`, ese path se excluye del check.
      - name: Run biome check
        run: pnpm exec biome check packages/ docs/ biome.json

  # ============================================================
  # Test stage
  # ============================================================

  test:
    name: test
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  # ============================================================
  # Build stage
  # ============================================================

  build:
    name: build
    runs-on: ubuntu-latest
    if: needs.release_gate.outputs.release == 'true'
    needs: [release_gate, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and docs
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            packages/vue/dist/
            docs/.vitepress/dist/
          retention-days: 1

  # ============================================================
  # Deploy stage
  # ============================================================

  deploy_docs:
    name: deploy_docs
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Deploy docs
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_DOCS: ${{ vars.DEPLOY_PATH_DOCS }}
        run: |
          tar czvf dist.tar.gz -C docs/.vitepress/dist .
          scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_DOCS"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_DOCS && tar xzvf dist.tar.gz && rm dist.tar.gz"

  # ============================================================
  # Rollback stage (manual en GitLab -> workflow_dispatch)
  # ============================================================

  rollback:
    name: rollback
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Resolve previous release tag
        id: prev
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous release tag to roll back to (only one v* tag exists). Nothing to do."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Rolling back to $PREVIOUS_TAG"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Build previous release
        if: steps.prev.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          git checkout "$PREVIOUS_TAG"
          pnpm install --frozen-lockfile
          pnpm --filter @dowardev/herdrate-vue build
          pnpm --filter herdrate-docs docs:build

      - name: Deploy previous release
        if: steps.prev.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_DOCS: ${{ vars.DEPLOY_PATH_DOCS }}
        run: |
          tar czvf dist.tar.gz -C docs/.vitepress/dist .
          scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_DOCS"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_DOCS && tar xzvf dist.tar.gz && rm dist.tar.gz"

  # ============================================================
  # Publish stage
  # Publica el paquete npm. En GitLab NO habia job de publish (se
  # publicaba a mano desde una maquina local); esto lo automatiza con el
  # mismo criterio que el deploy (solo tags de release validas).
  #
  # - Reutiliza el build ya testeado (artifact), no recompila.
  # - No publica si esa version ya esta en el registro.
  # - Sin el secret NPM_TOKEN no publica: lo omite con un warning, para
  #   no dejar en rojo la corrida de release.
  # ============================================================
  publish_npm:
    name: publish:npm
    runs-on: ubuntu-latest
    needs: [release_gate, build]
    if: startsWith(github.ref, 'refs/tags/') && needs.release_gate.outputs.release == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tested build
        uses: actions/download-artifact@v4
        with:
          name: build

      - name: Check the version against the npm registry
        id: version
        env:
          PACKAGE_DIR: packages/vue
        run: |
          set -euo pipefail
          name=$(node -p "require('./$PACKAGE_DIR/package.json').name")
          version=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          echo "package=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$( { npm view "$name" versions --json 2>/dev/null || true; } | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(raw);
                console.log(Array.isArray(parsed) ? parsed.join(" ") : String(parsed));
              } catch (error) {
                console.log("");
              }
            });
          ' )
          if [[ " $published " == *" $version "* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La version $version de $name ya esta publicada: se omite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::warning::Falta el secret NPM_TOKEN: se omite la publicacion a npm"
            echo "Publicacion a npm omitida: falta el secret NPM_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish --provenance --access public
