# ============================================================
# herdrateUi — GitHub Actions
# Traducido desde .gitlab-ci.yml (ver odd/tasks/github-migration-translation.md)
#
# DESVIACIÓN DOCUMENTADA (sección 0 de la guía): en GitLab este pipeline
# es 100% tag-only (`.tag_only` en TODOS los jobs) y el job `deploy_docs`
# consume los artifacts del job `build` dentro del MISMO pipeline. En
# GitHub los artifacts no cruzan entre workflows, así que los 5 jobs viven
# en un único workflow para preservar ese flujo de artifacts.
#
# Mapeo de jobs (nombres idénticos a propósito: son los required checks):
#   lint -> lint | test -> test | build -> build
#   deploy_docs -> deploy_docs | rollback -> rollback
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to roll back to (empty = previous tag computed automatically)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Lint stage
  # ============================================================

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El script `check` de GitLab era `biome check packages/ docs/ biome.json .gitlab-ci.yml`.
      # Como esta migración elimina `.gitlab-ci.yml`, ese path se excluye del check.
      - name: Run biome check
        run: pnpm exec biome check packages/ docs/ biome.json

  # ============================================================
  # Test stage
  # ============================================================

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  # ============================================================
  # Build stage
  # ============================================================

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and docs
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            packages/vue/dist/
            docs/.vitepress/dist/
          retention-days: 1

  # ============================================================
  # Deploy stage
  # ============================================================

  deploy_docs:
    name: deploy_docs
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy docs
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_DOCS: ${{ vars.DEPLOY_PATH_DOCS }}
        run: |
          tar czvf dist.tar.gz -C docs/.vitepress/dist .
          scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_DOCS"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_DOCS && tar xzvf dist.tar.gz && rm dist.tar.gz"

  # ============================================================
  # Rollback stage (manual en GitLab -> workflow_dispatch)
  # ============================================================

  rollback:
    name: rollback
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Resolve previous release tag
        id: prev
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous release tag to roll back to (only one v* tag exists). Nothing to do."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Rolling back to $PREVIOUS_TAG"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Build previous release
        if: steps.prev.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          git checkout "$PREVIOUS_TAG"
          pnpm install --frozen-lockfile
          pnpm --filter @dowardev/herdrate-vue build
          pnpm --filter herdrate-docs docs:build

      - name: Deploy previous release
        if: steps.prev.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_DOCS: ${{ vars.DEPLOY_PATH_DOCS }}
        run: |
          tar czvf dist.tar.gz -C docs/.vitepress/dist .
          scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_DOCS"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_DOCS && tar xzvf dist.tar.gz && rm dist.tar.gz"
