image: node:lts-alpine

stages:
  - lint
  - test
  - build
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/
    - packages/vue/node_modules/
    - docs/node_modules/
    - apps/demo/node_modules/

.tag_only:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

.install_deps:
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile

lint:
  stage: lint
  extends:
    - .tag_only
    - .install_deps
  script:
    - pnpm check

test:
  stage: test
  extends:
    - .tag_only
    - .install_deps
  script:
    - pnpm test

build:
  stage: build
  extends:
    - .tag_only
    - .install_deps
  script:
    - pnpm build
  artifacts:
    paths:
      - packages/vue/dist/
      - docs/.vitepress/dist/
    expire_in: 1 hour

deploy_docs:
  stage: deploy
  image: alpine
  extends:
    - .tag_only
    - .ssh_setup
  needs:
    - build
  script:
    - tar czvf dist.tar.gz -C docs/.vitepress/dist .
    - scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_DOCS"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_DOCS && tar xzvf dist.tar.gz && rm dist.tar.gz"
