image: node:24-alpine

stages:
  - lint
  - test
  - build
  - deploy
  - rollback

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pnpm-store/

.tag_only:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc|dryrun)\.\d+)?$/'

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      # The variable holds the key content, or the path to a file with it
      # (a GitLab file variable). Both shapes are accepted.
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      fi
      chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa

.install_deps:
  before_script:
    - apk add --no-cache make g++ python3 musl-dev
    - corepack enable
    - pnpm install --frozen-lockfile

lint:
  stage: lint
  extends:
    - .tag_only
    - .install_deps
  script:
    - pnpm check

test:
  stage: test
  extends:
    - .tag_only
    - .install_deps
  script:
    - pnpm test

build:
  stage: build
  extends:
    - .tag_only
    - .install_deps
  script:
    - pnpm build
  artifacts:
    paths:
      - packages/vue/dist/
      - docs/.vitepress/dist/
    expire_in: 1 hour

deploy_docs:
  stage: deploy
  image: alpine
  extends:
    - .tag_only
    - .ssh_setup
  needs:
    - build
  script:
    - tar czvf dist.tar.gz -C docs/.vitepress/dist .
    - scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_DOCS"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_DOCS && tar xzvf dist.tar.gz && rm dist.tar.gz"

rollback:
  stage: rollback
  image: alpine
  extends:
    - .tag_only
    - .ssh_setup
  when: manual
  script:
    - git fetch --tags --force || true
    - PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
    - if [ -z "$PREVIOUS_TAG" ]; then echo "No previous release tag to roll back to (only one v* tag exists). Nothing to do."; exit 0; fi
    - echo "Rolling back to $PREVIOUS_TAG"
    - git checkout "$PREVIOUS_TAG"
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm --filter @dowardev/herdrate-vue build
    - pnpm --filter herdrate-docs docs:build
    - tar czvf dist.tar.gz -C docs/.vitepress/dist .
    - scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_DOCS"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_DOCS && tar xzvf dist.tar.gz && rm dist.tar.gz"
