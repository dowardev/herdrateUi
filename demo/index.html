      python: `import csv
          import json
from dataclasses import dataclass
from typing import Optional


@dataclass
class Transaction:
    date: str
    amount: float
    category: str
    description: str


def load_transactions(path: str) -> list[Transaction]:
    result: list[Transaction] = []
    with open(path, newline="") as f:
        reader = csv.DictReader(f)
        for row in reader:
            t = Transaction(
                date=row["date"],
                amount=float(row["amount"]),
                category=row["category"],
                description=row["description"],
            )
            result.append(t)
    return result


def total_by_category(txns: list[Transaction]) -> dict[str, float]:
    totals: dict[str, float] = {}
    for t in txns:
        totals[t.category] = totals.get(t.category, 0.0) + t.amount
    return dict(sorted(totals.items(), key=lambda x: x[1], reverse=True))


def generate_report(txns: list[Transaction]) -> str:
    by_cat = total_by_category(txns)
    lines = ["=== GASTO POR CATEGORIA ==="]
    for cat, total in by_cat.items():
        bar = "█" * int(total / 100)
        lines.append(f"  {cat:20s}  {total:>8.2f}  {bar}")
    lines.append(f"\\nTOTAL: {sum(t.amount for t in txns):.2f}")
    return "\\n".join(lines)


if __name__ == "__main__":
    txns = load_transactions("data.csv")
    print(generate_report(txns))`,

      javascript: `const express = require("express");
      const { createServer } = require("node:http");
const { readFile, writeFile } = require("node:fs/promises");
const path = require("node:path");

const app = express();
const PORT = process.env.PORT || 3000;
const DATA_FILE = path.join(__dirname, "todos.json");

app.use(express.json());

async function readTodos() {
  try {
    const raw = await readFile(DATA_FILE, "utf-8");
    return JSON.parse(raw);
  } catch {
    return [];
  }
}

async function writeTodos(todos) {
  await writeFile(DATA_FILE, JSON.stringify(todos, null, 2));
}

app.get("/api/todos", async (_req, res) => {
  const todos = await readTodos();
  res.json(todos);
});

app.post("/api/todos", async (req, res) => {
  const { title } = req.body;
  if (!title || typeof title !== "string") {
    return res.status(400).json({ error: "title is required" });
  }
  const todos = await readTodos();
  const todo = { id: Date.now(), title, done: false };
  todos.push(todo);
  await writeTodos(todos);
  res.status(201).json(todo);
});

app.patch("/api/todos/:id", async (req, res) => {
  const id = Number(req.params.id);
  const todos = await readTodos();
  const idx = todos.findIndex((t) => t.id === id);
  if (idx === -1) return res.status(404).json({ error: "not found" });
  todos[idx] = { ...todos[idx], ...req.body };
  await writeTodos(todos);
  res.json(todos[idx]);
});

app.delete("/api/todos/:id", async (req, res) => {
  const id = Number(req.params.id);
  const todos = await readTodos();
  const filtered = todos.filter((t) => t.id !== id);
  if (filtered.length === todos.length) {
    return res.status(404).json({ error: "not found" });
  }
  await writeTodos(filtered);
  res.json({ ok: true });
});

const server = createServer(app);
server.listen(PORT, () => {
  console.log(\`Server running on http://localhost:\${PORT}\`);
});`,

      typescript: `interface User {
  id: string;
  name: string;
  email: string;
  role: "admin" | "editor" | "viewer";
  createdAt: Date;
}

interface PaginatedResult<T> {
  data: T[];
  total: number;
  page: number;
  pageSize: number;
  hasMore: boolean;
}

type SortDirection = "asc" | "desc";

interface SortConfig {
  field: string;
  direction: SortDirection;
}

class UserRepository {
  private users: Map<string, User> = new Map();

  async findById(id: string): Promise<User | null> {
    return this.users.get(id) ?? null;
  }

  async findMany(
    filter: Partial<User> = {},
    sort?: SortConfig,
    page = 1,
    pageSize = 20
  ): Promise<PaginatedResult<User>> {
    let results = Array.from(this.users.values());

    for (const [key, value] of Object.entries(filter)) {
      results = results.filter(
        (u) => u[key as keyof User] === value
      );
    }

    if (sort) {
      results.sort((a, b) => {
        const aVal = a[sort.field as keyof User];
        const bVal = b[sort.field as keyof User];
        const cmp = String(aVal).localeCompare(String(bVal));
        return sort.direction === "asc" ? cmp : -cmp;
      });
    }

    const total = results.length;
    const start = (page - 1) * pageSize;
    const paged = results.slice(start, start + pageSize);

    return {
      data: paged,
      total,
      page,
      pageSize,
      hasMore: start + pageSize < total,
    };
  }

  async save(user: User): Promise<void> {
    this.users.set(user.id, user);
  }

  async delete(id: string): Promise<boolean> {
    return this.users.delete(id);
  }
}`,

      sql: `-- =============================================
-- Esquema de base de datos — Sistema de e-commerce
-- =============================================

CREATE EXTENSION IF NOT EXISTS "pgcrypto";

CREATE TYPE user_role AS ENUM ('admin', 'seller', 'customer');
CREATE TYPE order_status AS ENUM (
  'pending', 'confirmed', 'processing',
  'shipped', 'delivered', 'cancelled'
);

-- Tabla: usuarios
CREATE TABLE users (
  id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  email      VARCHAR(255) NOT NULL UNIQUE,
  password   VARCHAR(255) NOT NULL,
  name       VARCHAR(150) NOT NULL,
  role       user_role NOT NULL DEFAULT 'customer',
  created_at TIMESTAMPTZ  NOT NULL DEFAULT now(),
  updated_at TIMESTAMPTZ  NOT NULL DEFAULT now()
);

CREATE INDEX idx_users_email ON users (email);
CREATE INDEX idx_users_role   ON users (role);

-- Tabla: productos
CREATE TABLE products (
  id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  seller_id   UUID NOT NULL REFERENCES users(id),
  title       VARCHAR(255) NOT NULL,
  slug        VARCHAR(300) NOT NULL UNIQUE,
  description TEXT,
  price       NUMERIC(10, 2) NOT NULL CHECK (price >= 0),
  stock       INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0),
  category    VARCHAR(100),
  tags        TEXT[] DEFAULT '{}',
  published   BOOLEAN NOT NULL DEFAULT false,
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE INDEX idx_products_seller   ON products (seller_id);
CREATE INDEX idx_products_category ON products (category);
CREATE INDEX idx_products_published ON products (published)
  WHERE published = true;

-- Tabla: órdenes
CREATE TABLE orders (
  id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  customer_id UUID NOT NULL REFERENCES users(id),
  status      order_status NOT NULL DEFAULT 'pending',
  total       NUMERIC(12, 2) NOT NULL,
  shipping    NUMERIC(8, 2) DEFAULT 0,
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE INDEX idx_orders_customer ON orders (customer_id);
CREATE INDEX idx_orders_status   ON orders (status);

-- Tabla: ítems de orden
CREATE TABLE order_items (
  id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  order_id   UUID NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
  product_id UUID NOT NULL REFERENCES products(id),
  quantity   INTEGER NOT NULL CHECK (quantity > 0),
  unit_price NUMERIC(10, 2) NOT NULL
);

CREATE INDEX idx_order_items_order ON order_items (order_id);

-- Vista: órdenes con total de ítems
CREATE VIEW order_summary AS
SELECT
  o.id,
  o.customer_id,
  u.name AS customer_name,
  o.status,
  COUNT(oi.id) AS item_count,
  o.total,
  o.created_at
FROM orders o
JOIN users u ON u.id = o.customer_id
LEFT JOIN order_items oi ON oi.order_id = o.id
GROUP BY o.id, u.name;

-- Función: actualizar stock al confirmar orden
CREATE OR REPLACE FUNCTION confirm_order(order_id UUID)
RETURNS void AS $$
BEGIN
  UPDATE products p
  SET stock = stock - oi.quantity
  FROM order_items oi
  WHERE oi.product_id = p.id
    AND oi.order_id = confirm_order.order_id;

  UPDATE orders
  SET status = 'confirmed'
  WHERE id = confirm_order.order_id;
END;
$$ LANGUAGE plpgsql;

-- Consulta de ejemplo
SELECT
  o.id,
  u.name,
  o.status,
  o.total::money::text AS total_formatted,
  o.created_at::date   AS order_date
FROM orders o
JOIN users u ON u.id = o.customer_id
WHERE o.created_at >= now() - interval '30 days'
ORDER BY o.created_at DESC
LIMIT 50;`,

      bash: `#!/usr/bin/env bash
# ============================================
# deploy.sh — Script de despliegue automatizado
# ============================================

set -euo pipefail

APP_NAME="myapp"
DEPLOY_DIR="/var/www/\${APP_NAME}"
BACKUP_DIR="/var/backups/\${APP_NAME}"
LOG_FILE="/var/log/\${APP_NAME}/deploy.log"
REPO_URL="git@github.com:org/\${APP_NAME}.git"
BRANCH="main"

# Colores para output
RED='\\033[0;31m'
GREEN='\\033[0;32m'
YELLOW='\\033[1;33m'
NC='\\033[0m'

log() {
  local level="$1"
  local msg="$2"
  local ts
  ts="$(date '+%Y-%m-%d %H:%M:%S')"
  echo -e "\${ts} [\${level}] \${msg}" | tee -a "$LOG_FILE"
}

info()  { log "INFO"  "\${GREEN}$1\${NC}"; }
warn()  { log "WARN"  "\${YELLOW}$1\${NC}"; }
error() { log "ERROR" "\${RED}$1\${NC}"; }

cleanup() {
  info "Limpiando archivos temporales..."
  rm -rf "/tmp/\${APP_NAME}-build-*"
}

trap cleanup EXIT

build_app() {
  local commit_hash

  info "Clonando repositorio (branch: \${BRANCH})..."
  local tmp_dir
  tmp_dir="$(mktemp -d "/tmp/\${APP_NAME}-build-XXXXXX")"
  git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$tmp_dir"

  commit_hash="$(git -C "$tmp_dir" rev-parse --short HEAD)"
  info "Commit: \${commit_hash}"

  info "Instalando dependencias..."
  (cd "$tmp_dir" && npm ci --omit=dev)

  info "Compilando assets..."
  (cd "$tmp_dir" && npm run build)

  echo "$tmp_dir"
}

backup_current() {
  if [[ -d "$DEPLOY_DIR/current" ]]; then
    local ts
    ts="$(date '+%Y%m%d_%H%M%S')"
    info "Respaldando versión actual..."
    mkdir -p "$BACKUP_DIR"
    cp -r "$DEPLOY_DIR/current" "$BACKUP_DIR/\${ts}"
    info "Respaldo creado: \${BACKUP_DIR}/\${ts}"
  fi
}

deploy() {
  local build_dir="$1"

  info "Deteniendo servicio..."
  systemctl stop "\${APP_NAME}.service" || true

  info "Copiando build a \${DEPLOY_DIR}/current..."
  mkdir -p "$DEPLOY_DIR"
  rm -rf "\${DEPLOY_DIR}/current"
  cp -r "$build_dir" "\${DEPLOY_DIR}/current"

  info "Aplicando permisos..."
  chown -R www-data:www-data "$DEPLOY_DIR"
  chmod -R 755 "$DEPLOY_DIR"

  info "Iniciando servicio..."
  systemctl start "\${APP_NAME}.service"

  info "Verificando estado..."
  sleep 2
  if systemctl is-active --quiet "\${APP_NAME}.service"; then
    info "Despliegue completado con éxito"
  else
    error "El servicio no inició correctamente"
    exit 1
  fi
}

rollback() {
  local latest
  latest="$(ls -t "$BACKUP_DIR" | head -1)"
  if [[ -z "$latest" ]]; then
    error "No hay respaldos disponibles"
    exit 1
  fi
  info "Revirtiendo a \${latest}..."
  rm -rf "\${DEPLOY_DIR}/current"
  cp -r "$BACKUP_DIR/$latest" "\${DEPLOY_DIR}/current"
  systemctl restart "\${APP_NAME}.service"
  info "Rollback completado"
}

main() {
  info "Iniciando despliegue de \${APP_NAME}..."

  case "\${1:-deploy}" in
    deploy)
      local build_dir
      build_dir="$(build_app)"
      backup_current
      deploy "$build_dir"
      ;;
    rollback)
      rollback
      ;;
    *)
      echo "Uso: $0 {deploy|rollback}"
      exit 1
      ;;
  esac
}

main "$@"`,

      go: `package main

import (
	"context"
	"encoding/json"
	"fmt"
	"log"
	"net/http"
	"os"
	"os/signal"
	"syscall"
	"time"
)

type Todo struct {
	ID        int       \`json:"id"\`
	Title     string    \`json:"title"\`
	Completed bool      \`json:"completed"\`
	CreatedAt time.Time \`json:"created_at"\`
}

type TodoStore struct {
	todos  map[int]Todo
	nextID int
}

func NewTodoStore() *TodoStore {
	return &TodoStore{
		todos:  make(map[int]Todo),
		nextID: 1,
	}
}

func (s *TodoStore) Create(title string) Todo {
	t := Todo{
		ID:        s.nextID,
		Title:     title,
		Completed: false,
		CreatedAt: time.Now(),
	}
	s.todos[s.nextID] = t
	s.nextID++
	return t
}

func (s *TodoStore) GetAll() []Todo {
	result := make([]Todo, 0, len(s.todos))
	for _, t := range s.todos {
		result = append(result, t)
	}
	return result
}

func (s *TodoStore) GetByID(id int) (Todo, bool) {
	t, ok := s.todos[id]
	return t, ok
}

func (s *TodoStore) Update(id int, title string, completed bool) (Todo, bool) {
	t, ok := s.todos[id]
	if !ok {
		return Todo{}, false
	}
	t.Title = title
	t.Completed = completed
	s.todos[id] = t
	return t, true
}

func (s *TodoStore) Delete(id int) bool {
	_, ok := s.todos[id]
	if ok {
		delete(s.todos, id)
	}
	return ok
}

func jsonResponse(w http.ResponseWriter, status int, data any) {
	w.Header().Set("Content-Type", "application/json")
	w.WriteHeader(status)
	json.NewEncoder(w).Encode(data)
}

type Server struct {
	store *TodoStore
	mux   *http.ServeMux
}

func NewServer(store *TodoStore) *Server {
	s := &Server{
		store: store,
		mux:   http.NewServeMux(),
	}
	s.routes()
	return s
}

func (s *Server) routes() {
	s.mux.HandleFunc("GET /api/todos", s.handleListTodos)
	s.mux.HandleFunc("POST /api/todos", s.handleCreateTodo)
	s.mux.HandleFunc("GET /api/todos/{id}", s.handleGetTodo)
	s.mux.HandleFunc("PUT /api/todos/{id}", s.handleUpdateTodo)
	s.mux.HandleFunc("DELETE /api/todos/{id}", s.handleDeleteTodo)
}

func (s *Server) handleListTodos(w http.ResponseWriter, r *http.Request) {
	todos := s.store.GetAll()
	jsonResponse(w, http.StatusOK, todos)
}

func (s *Server) handleCreateTodo(w http.ResponseWriter, r *http.Request) {
	var body struct {
		Title string \`json:"title"\`
	}
	if err := json.NewDecoder(r.Body).Decode(&body); err != nil {
		jsonResponse(w, http.StatusBadRequest, map[string]string{
			"error": "invalid JSON",
		})
		return
	}
	if body.Title == "" {
		jsonResponse(w, http.StatusBadRequest, map[string]string{
			"error": "title is required",
		})
		return
	}
	todo := s.store.Create(body.Title)
	jsonResponse(w, http.StatusCreated, todo)
}

func (s *Server) handleGetTodo(w http.ResponseWriter, r *http.Request) {
	id := 0
	fmt.Sscanf(r.PathValue("id"), "%d", &id)
	todo, ok := s.store.GetByID(id)
	if !ok {
		jsonResponse(w, http.StatusNotFound, map[string]string{
			"error": "not found",
		})
		return
	}
	jsonResponse(w, http.StatusOK, todo)
}

func (s *Server) handleUpdateTodo(w http.ResponseWriter, r *http.Request) {
	id := 0
	fmt.Sscanf(r.PathValue("id"), "%d", &id)
	var body struct {
		Title     string \`json:"title"\`
		Completed bool   \`json:"completed"\`
	}
	if err := json.NewDecoder(r.Body).Decode(&body); err != nil {
		jsonResponse(w, http.StatusBadRequest, map[string]string{
			"error": "invalid JSON",
		})
		return
	}
	todo, ok := s.store.Update(id, body.Title, body.Completed)
	if !ok {
		jsonResponse(w, http.StatusNotFound, map[string]string{
			"error": "not found",
		})
		return
	}
	jsonResponse(w, http.StatusOK, todo)
}

func (s *Server) handleDeleteTodo(w http.ResponseWriter, r *http.Request) {
	id := 0
	fmt.Sscanf(r.PathValue("id"), "%d", &id)
	if !s.store.Delete(id) {
		jsonResponse(w, http.StatusNotFound, map[string]string{
			"error": "not found",
		})
		return
	}
	jsonResponse(w, http.StatusOK, map[string]bool{"ok": true})
}

func main() {
	store := NewTodoStore()
	server := NewServer(store)

	httpServer := &http.Server{
		Addr:         ":8080",
		Handler:      server.mux,
		ReadTimeout:  10 * time.Second,
		WriteTimeout: 10 * time.Second,
		IdleTimeout:  60 * time.Second,
	}

	ctx, stop := signal.NotifyContext(
		context.Background(),
		syscall.SIGINT,
		syscall.SIGTERM,
	)
	defer stop()

	go func() {
		log.Printf("Servidor iniciado en http://localhost:8080")
		if err := httpServer.ListenAndServe(); err != nil &&
			err != http.ErrServerClosed {
			log.Fatalf("Error al iniciar servidor: %v", err)
		}
	}()

	<-ctx.Done()
	log.Println("Apagando servidor...")

	shutdownCtx, cancel := context.WithTimeout(
		context.Background(), 15*time.Second,
	)
	defer cancel()

	if err := httpServer.Shutdown(shutdownCtx); err != nil {
		log.Fatalf("Error al apagar servidor: %v", err)
	}
	log.Println("Servidor detenido correctamente")
}`,
